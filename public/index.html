<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>프라이빗 영화관</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" />
    <style>

        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=SF+Pro+Display:wght@400;500;600&display=swap');
        
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100dvh; background: #000; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; color: #fff; }
        
        .material-symbols-rounded { font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24; font-size: 24px; }
        
        /* 🎥 1. 상단 고급스러운 로고 */
        .brand-logo { position: absolute; top: max(25px, env(safe-area-inset-top)); left: 25px; font-family: 'Playfair Display', serif; font-size: 24px; line-height: 1.1; font-weight: 600; letter-spacing: 1px; color: #fff; z-index: 50; text-shadow: 0 4px 15px rgba(0,0,0,0.8); pointer-events: none; }
        .brand-logo span { display: block; font-size: 14px; letter-spacing: 2px; opacity: 0.7; font-family: -apple-system, sans-serif; margin-top: 4px; }

        /* 로비 화면 */
        #lobbyContainer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; background: radial-gradient(circle at 50% 50%, #1a1a24 0%, #000 100%); z-index: 100; }
        #lobbyContainer h1 { font-family: 'Playfair Display', serif; margin: 0 0 10px 0; font-size: 3em; font-weight: 600; }
        #lobbyContainer p { color: #8E8E93; margin-top: 0; font-size: 1.1em; margin-bottom: 40px; }
        .controls { display: flex; flex-direction: column; gap: 14px; max-width: 340px; width: 100%; background: rgba(255,255,255,0.03); padding: 35px; border-radius: 24px; border: 1px solid rgba(255,255,255,0.05); backdrop-filter: blur(20px); box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
        input { padding: 18px; font-size: 16px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background-color: rgba(0,0,0,0.5); color: #fff; width: 100%; outline: none; transition: border 0.3s; }
        input:focus { border-color: #fff; background-color: rgba(255,255,255,0.05); }
        button { padding: 18px; font-size: 16px; cursor: pointer; border: none; border-radius: 12px; font-weight: 600; transition: all 0.2s; }
        #hostBtn { background-color: #fff; color: #000; box-shadow: 0 8px 20px rgba(255,255,255,0.2); }
        #joinBtn { background-color: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.1); }
        button:active { transform: scale(0.97); }

        /* 극장 화면 */
        #theaterContainer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; background: #000; }
        
        #videoContainer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; z-index: 1; }
        
        /* 🔥 환상적인 앰비라이트 후광 */
        #videoContainer::after { content: ''; position: absolute; top: 20%; left: 5%; width: 90%; height: 60%; background: transparent; box-shadow: 0 0 120px 60px rgba(255, 120, 50, 0.15), 0 0 200px 90px rgba(0, 150, 255, 0.15); z-index: -1; pointer-events: none; border-radius: 40%;  }
        
        #videoPlayer { width: 100%; height: 100%; object-fit: contain; }

        /* 📸 웹캠 */
        #camArea { position: absolute; top: max(25px, env(safe-area-inset-top)); right: 25px; display: flex; flex-direction: row; gap: 15px; z-index: 20; pointer-events: none; }
        .cam-box { position: relative; width: 110px; aspect-ratio: 4/5; background: #1a1a24; border-radius: 16px; overflow: hidden; pointer-events: auto; border: 1px solid rgba(255,255,255,0.15); box-shadow: 0 20px 40px rgba(0,0,0,0.8); }
        .cam-box video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        .cam-badge { position: absolute; top: 8px; right: 8px; background: rgba(255, 215, 0, 0.8); color: #000; font-size: 10px; font-weight: 700; padding: 3px 6px; border-radius: 8px; backdrop-filter: blur(5px); }
        .cam-info { position: absolute; bottom: 0; left: 0; width: 100%; background: linear-gradient(to top, rgba(0,0,0,0.9), transparent); padding: 25px 10px 10px 10px; }
        .cam-name { font-size: 12px; font-weight: 600; color: #fff; margin-bottom: 2px; }
        .cam-status { font-size: 10px; color: #4CAF50; font-weight: 500; }

        /* 💬 채팅 버튼 & 입력창 (웹캠 아래 고정) */
        #chatSection { position: absolute; top: max(190px, calc(env(safe-area-inset-top) + 180px)); right: 25px; display: flex; align-items: center; justify-content: flex-end; gap: 12px; z-index: 50; pointer-events: none; }
        
        #chatToggleBtn { position: relative; width: 48px; height: 48px; border-radius: 50%; background: rgba(40, 40, 45, 0.8); border: 1px solid rgba(255,255,255,0.2); color: white; cursor: pointer; pointer-events: auto; box-shadow: 0 10px 20px rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; backdrop-filter: blur(20px); transition: all 0.2s; z-index: 51; }
        #chatToggleBtn:active { transform: scale(0.9); }
        #chatToggleBtn .material-symbols-rounded { font-size: 24px; }
        
        #chatInputWrapper { display: none; background: rgba(30, 30, 35, 0.9); border-radius: 20px; padding: 6px; backdrop-filter: blur(25px); border: 1px solid rgba(255,255,255,0.2); pointer-events: auto; align-items: center; gap: 8px; box-shadow: 0 15px 35px rgba(0,0,0,0.7); z-index: 50; }
        #chatInput { background: transparent; border: none; color: #fff; outline: none; width: 180px; font-size: 15px; padding: 8px 12px; font-family: inherit; }
        #chatInput::placeholder { color: #8E8E93; }
        #chatBtn { background: #fff; color: #000; border: none; border-radius: 50%; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer; }
        #chatBtn .material-symbols-rounded { font-size: 18px; font-weight: 700; }

        /* 🎛️ 하단 메인 컨트롤러 (컴팩트하게 중앙 정렬) */
        #bottomConsole { position: absolute; bottom: max(35px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); display: flex; align-items: center; justify-content: center; background: rgba(40, 40, 45, 0.5); backdrop-filter: blur(40px) saturate(200%); -webkit-backdrop-filter: blur(40px) saturate(200%); padding: 12px 24px; border-radius: 100px; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 30px 60px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.1); z-index: 40; gap: 20px; width: max-content; }
        
        .console-btn { background: transparent; border: none; color: #fff; cursor: pointer; border-radius: 50%; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
        .console-btn:active { transform: scale(0.9); }
        
        /* 중앙 플레이/일시정지 강조 버튼 (SOS) */
        .play-pause-btn { width: 56px; height: 56px; background: rgba(255,255,255,0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 20px rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); }
        .play-pause-btn .material-symbols-rounded { font-size: 32px; }
        
        /* 볼륨 슬라이더 */
        .vol-group { display: flex; align-items: center; gap: 10px; color: #fff; }
        .vol-group .material-symbols-rounded { font-size: 22px; opacity: 0.9; }
        .vol-group input[type=range] { -webkit-appearance: none; width: 80px; height: 3px; border-radius: 2px; background: rgba(255,255,255,0.3); outline: none; cursor: pointer; }
        .vol-group input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #fff; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.5); }
        
        /* 우측 유틸 버튼들 */
        .util-group { display: flex; align-items: center; gap: 8px; }
        .util-btn { font-size: 1.5em; background: transparent; border: none; cursor: pointer; transition: transform 0.2s; padding: 4px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .util-btn:hover { transform: scale(1.2); }

        /* 🌠 자막 티커 */
        #tickerContainer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 15; }
        #tickerContainer div { position: absolute; white-space: nowrap; font-weight: 600; text-shadow: 0 4px 15px rgba(0,0,0,0.9); }

        /* 리액션 및 SOS */
        #reactionContainer { position: absolute; bottom: 120px; right: 30px; width: 60px; height: 100%; pointer-events: none; z-index: 50; }
        .reaction-bubble { position: absolute; font-size: 2.5em; bottom: -50px; opacity: 1; animation: floatUp 3s cubic-bezier(0.25, 1, 0.5, 1) forwards; text-shadow: 0 5px 10px rgba(0,0,0,0.5); }
        @keyframes floatUp { 0% { transform: translateY(0) scale(0.5); opacity: 0; } 15% { transform: translateY(-30px) scale(1.2); opacity: 1; } 100% { transform: translateY(-80vh) scale(1); opacity: 0; } }
        
        #sosOverlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(25px); z-index: 200; display: none; align-items: center; justify-content: center; flex-direction: column; text-align: center; pointer-events: auto; }
        #sosOverlay h1 { font-family: 'Playfair Display', serif; font-size: 3em; color: #fff; margin-bottom: 10px; font-weight: 600; }
        #sosOverlay p { color: #8E8E93; margin-bottom: 30px; font-size: 1.1em; }
        #sosOverlay button { background: #fff; color: #000; padding: 18px 45px; border-radius: 30px; font-weight: 600; border: none; font-size: 1.1em; cursor: pointer; }
        
        /* 모바일 최적화 */
        @media (max-width: 600px) {
            .brand-logo { font-size: 20px; top: 15px; left: 15px; }
            .cam-box { width: 90px; }
            #chatSection { top: max(160px, calc(env(safe-area-inset-top) + 140px)); right: 15px; flex-direction: column; align-items: flex-end; }
            #chatInput { width: 140px; font-size: 14px; }
            #chatToggleBtn { width: 44px; height: 44px; }
            #bottomConsole { padding: 8px 16px; gap: 8px; width: auto; min-width: 280px; max-width: 95vw; justify-content: center; border-radius: 40px; }
            .vol-group input[type=range] { width: 50px; }
            .play-pause-btn { width: 44px; height: 44px; margin: 0 4px; }
            .play-pause-btn .material-symbols-rounded { font-size: 24px; }
            .util-btn { font-size: 1.2em; padding: 0; }
        }

    </style>
</head>
<body>
    <div id="lobbyContainer">
        <h1>PRIVATE<br>THEATER</h1>
        <p>둘만의 완벽한 시네마 룸</p>
        <div class="controls">
            <div id="status" style="font-weight: 600; color: #8E8E93; font-size: 0.9em; margin-bottom: 5px;">연결 대기 중...</div>
            <input type="text" id="roomInput" placeholder="입장할 방 이름 (예: movie)" value="movie-room">
            <button id="hostBtn">방 만들기</button>
            <button id="joinBtn">참여하기</button>
            <div class="warning">⚠️ 하드웨어 가속을 끄고 마이크 권한을 허용해주세요.</div>
        </div>
    </div>

    <div id="theaterContainer">
        <!-- 0. 고급 텍스트 로고 -->
        <div class="brand-logo">PRIVATE<br>THEATER<span>PREMIUM</span></div>

        <!-- 1. 메인 영화 화면 -->
        <div id="videoContainer">
            <video id="videoPlayer" autoplay playsinline></video>
        </div>

        <!-- 2. 웹캠 (VIP 카드 디자인) -->
        <div id="camArea">
            <div class="cam-box" id="localCamBox" style="display: none;">
                <video id="localCam" autoplay playsinline muted></video>
                <div class="cam-badge">VIP 1</div>
                <div class="cam-info">
                    <div class="cam-name">Me</div>
                    <div class="cam-status">Active</div>
                </div>
            </div>
            <div class="cam-box" id="remoteCamBox" style="display: none;">
                <video id="remoteCam" autoplay playsinline></video>
                <div class="cam-badge" style="background: rgba(255,255,255,0.9);">VIP 2</div>
                <div class="cam-info">
                    <div class="cam-name">Guest</div>
                    <div class="cam-status">Active</div>
                </div>
            </div>
        </div>

        <!-- 3. 분리형 채팅 입력창 -->
        <div id="chatSection">
            <div id="chatInputWrapper">
                <input type="text" id="chatInput" placeholder="메시지 입력..." onkeypress="if(event.key==='Enter') sendChat()">
                <button id="chatBtn" onclick="sendChat()"><span class="material-symbols-rounded">arrow_upward</span></button>
            </div>
            <button id="chatToggleBtn" onclick="toggleChat()"><span class="material-symbols-rounded">chat_bubble</span></button>
        </div>

        <!-- 4. 하단 메인 컨트롤러 (목업 완벽 구현) -->
        <div id="bottomConsole">
            <!-- 볼륨 슬라이더 -->
            <div class="vol-group">
                <span class="material-symbols-rounded">volume_up</span>
                <input type="range" id="voiceVol" min="1" max="5" step="0.5" value="1" oninput="changeVol(this.value)">
            </div>
            
            <!-- 재생/일시정지 (SOS 버튼 역할) -->
            <button class="console-btn icon-btn play-pause-btn" onclick="sendSOS()">
                <span class="material-symbols-rounded">pause</span>
            </button>
            
            <!-- 우측 유틸 (채팅 토글, 리액션) -->
            <div class="util-group">
                
                <button class="util-btn" onclick="sendReaction('❤️')">❤️</button>
                <button class="util-btn" onclick="sendReaction('😂')">😂</button>
            </div>
        </div>

        <!-- 🌠 자막 티커 -->
        <div id="tickerContainer"></div>
        <!-- 리액션 및 SOS -->
        <div id="reactionContainer"></div>

        <div id="sosOverlay">
            <h1>Pause Requested</h1>
            <p>상대방이 영화를 잠시 멈췄습니다.</p>
            <button onclick="document.getElementById('sosOverlay').style.display='none'">재개하기</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js?v=32"></script>
</body>
</html>
