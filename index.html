<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>둘만의 프라이빗 영화관</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #141414; color: #fff; text-align: center; margin: 0; padding: 20px; overflow-x: hidden; }
        h1 { margin-bottom: 5px; }
        p { color: #aaa; margin-top: 0; font-size: 0.9em; }
        .controls { margin-top: 20px; margin-bottom: 20px; padding: 15px; background-color: #222; border-radius: 8px; display: inline-block; }
        input { padding: 10px; font-size: 16px; border-radius: 4px; border: 1px solid #333; background-color: #000; color: #fff; margin-right: 5px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; border: none; border-radius: 4px; font-weight: bold; margin: 5px; }
        #hostBtn { background-color: #E50914; color: white; }
        #hostBtn:hover { background-color: #f40612; }
        #joinBtn { background-color: #333; color: white; }
        #joinBtn:hover { background-color: #444; }
        
        /* 영화 메인 화면 (가로 꽉 차게) */
        #videoContainer { position: relative; width: 100%; max-width: none; margin: 0 auto; background-color: #000; overflow: hidden; aspect-ratio: 16/9; display: flex; align-items: center; justify-content: center; }
        #videoPlayer { width: 100%; height: 100%; outline: none; }
        
        /* 웹캠 오버레이 (화면 양쪽 배치) */
        .cam-box { position: fixed; top: 50%; transform: translateY(-50%); width: 80px; aspect-ratio: 4/3; background-color: #333; border-radius: 6px; overflow: hidden; border: 1px solid rgba(255,255,255,0.3); box-shadow: 0 4px 10px rgba(0,0,0,0.5); z-index: 20; opacity: 0.7; transition: opacity 0.3s; }
        .cam-box:hover { opacity: 1; }
        #localCamBox { left: 10px; }
        #remoteCamBox { right: 10px; }
        
        .cam-box video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        .cam-label { position: absolute; bottom: 4px; left: 4px; background: rgba(0,0,0,0.6); font-size: 10px; padding: 2px 4px; border-radius: 3px; }
        
        #status { font-size: 1.2em; font-weight: bold; margin-bottom: 10px; color: #4caf50; }
        .warning { color: #ff9800; font-size: 0.85em; margin-top: 10px; display: block; }
    </style>
</head>
<body>
    <h1>🍿 프라이빗 영화관</h1>
    <p>서로 얼굴을 보며 TVING을 즐기세요!</p>

    <div class="controls">
        <div id="status">연결 대기 중...</div>
        <div>
            <input type="text" id="roomInput" placeholder="방 이름 입력 (예: minji)" value="movie-room">
            <button id="hostBtn">방 만들기 (영화 공유)</button>
            <button id="joinBtn">방 참여하기 (같이 보기)</button>
        </div>
        <div style="margin-top: 15px; background: #333; padding: 10px; border-radius: 5px; display: inline-block;">
            <label for="voiceVol" style="font-size: 0.9em; margin-right: 10px;">🎤 화상통화 소리 증폭:</label>
            <input type="range" id="voiceVol" min="1" max="5" step="0.5" value="1" style="vertical-align: middle;">
            <span id="volLabel" style="font-size: 0.8em; margin-left: 5px;">1x (기본)</span>
        </div>
        <div style="margin-top: 10px;">
            <span class="warning">⚠️ 주의: 하드웨어 가속 끄기 필수. 카메라/마이크 권한을 허용해주세요.</span>
        </div>
    </div>

    <div id="videoContainer">
        <!-- 메인 영화 화면 -->
        <video id="videoPlayer" autoplay playsinline controls></video>
    </div>

    <!-- 좌측 웹캠 화면 (나) -->
    <div class="cam-box" id="localCamBox" style="display: none;">
        <video id="localCam" autoplay playsinline muted></video>
        <div class="cam-label">나</div>
    </div>
    
    <!-- 우측 웹캠 화면 (상대방) -->
    <div class="cam-box" id="remoteCamBox" style="display: none;">
        <video id="remoteCam" autoplay playsinline></video>
        <div class="cam-label">상대방</div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
